<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shows</title>
<meta name="description" content="Upcoming PF improv shows in Austin, Texas — dates, venues and tickets.">
<meta property="og:type" content="website">
<meta property="og:title" content="PF — Improv in Austin">
<meta property="og:description" content="Longform improv in Austin, Texas. Upcoming show dates and tickets.">
<link rel="preload" href="assets/fonts/geraldton-black.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0c0a10">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<main>
  <section class="hero">
    <div class="wrap">
      <p class="eyebrow" id="heroEyebrow">Live improv</p>
      <h1 id="heroTitle"></h1>
      <p class="tagline" id="heroTagline"></p>
      <div id="nextShow"></div>
    </div>
  </section>

  <section class="section" id="upcoming">
    <div class="wrap">
      <div class="section-head">
        <h2>Upcoming shows</h2>
        <span class="muted small" id="upcomingCount"></span>
      </div>
      <div id="upcomingList" class="shows">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>

      <details class="archive" id="archive" hidden>
        <summary id="archiveSummary">Past shows</summary>
        <div id="pastList" class="shows" style="margin-top:12px"></div>
      </details>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="card" style="display:flex;gap:24px;flex-wrap:wrap;align-items:center;justify-content:space-between">
        <div style="max-width:52ch">
          <h2 style="margin-bottom:10px">Want us at your thing?</h2>
          <p class="muted" style="margin:0">Corporate events, private parties, festivals, workshops. We travel.</p>
        </div>
        <a class="btn btn-primary" href="book.html">Book the troupe</a>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/demo.js"></script>
<script src="assets/js/lib.js"></script>
<script src="assets/js/calendar.js"></script>
</body>
</html>
